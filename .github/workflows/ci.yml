name: CI

on:
    push:
        branches: [main]
    # Every pull request, not only those into main, so a pull request stacked on another's branch
    # is checked before it is merged down.
    pull_request:
    # The release workflow runs these same checks before it publishes, and publishes only the
    # packed package whose checksum the oldest Node check reports.
    workflow_call:
        outputs:
            prose-check-sha256:
                description: The checksum of the packed prose check the oldest Node check proved.
                value: ${{ jobs.prose-check-floor.outputs.sha256 }}
            install-check-sha256:
                description: The checksum of the packed install check the oldest Node check proved.
                value: ${{ jobs.install-check-floor.outputs.sha256 }}

permissions:
    contents: read

# A newer push to a pull request supersedes the run in progress. Runs on main wait their turn.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    verify:
        name: Lint and test
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc

            # Without their install scripts, so no dependency runs code as it installs.
            - name: Install dependencies
              run: npm ci --ignore-scripts

            # npm ci installs from the lockfile without comparing it with each workspace's
            # manifest, so a field changed in a package.json, such as its engines, can leave the
            # lockfile behind. Writing the lockfile again changes nothing when the two agree.
            - name: Check the lockfile matches the manifests
              run: |
                  npm install --package-lock-only --ignore-scripts
                  git diff --exit-code package-lock.json

            - name: Type-check
              run: npm run type-check

            - name: Lint
              run: npm run lint

            - name: Format check
              run: npm run format:check

            - name: Prose check
              run: npm run prose

            - name: Install check
              run: npm run installs

            - name: Node version check
              run: npm run node-check

            - name: Unit tests
              run: npm run test:run

    prose-check-floor:
        name: Prose check on oldest Node
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        outputs:
            sha256: ${{ steps.pack.outputs.sha256 }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc

            # Without their install scripts, so no dependency runs code as it installs.
            - name: Install dependencies
              run: npm ci --ignore-scripts

            # Its checksum is a job output, which no other job in the run can change, unlike the
            # artifact, so a release publishes only this tarball.
            - name: Pack the prose check
              id: pack
              run: |
                  npm pack --workspace @jasonsdevspace/prose-check --pack-destination "$RUNNER_TEMP"
                  tarballs=("$RUNNER_TEMP"/jasonsdevspace-prose-check-*.tgz)
                  if [ "${#tarballs[@]}" -ne 1 ] || [ ! -f "${tarballs[0]}" ]; then
                      echo "packing made ${#tarballs[@]} tarballs, not one"
                      exit 1
                  fi
                  sum=$(sha256sum "${tarballs[0]}" | cut -d' ' -f1)
                  echo "sha256=$sum" >> "$GITHUB_OUTPUT"
                  # Printed too, in the form `sha256sum -c` reads, so a tarball downloaded from the
                  # run can be checked against it. The summary reports and never fails the step.
                  name=$(basename "${tarballs[0]}")
                  echo "$sum  $name"
                  printf '### Packed\n\n```\n%s  %s\n```\n' "$sum" "$name" >> "$GITHUB_STEP_SUMMARY" ||
                      echo "The summary could not be written."

            # That its exports, types, bin and files point at what the tarball holds.
            - name: Check the package manifest
              run: npx --no-install publint packages/prose-check

            # Written as an exact version, because setup-node given a range installs the newest
            # Node in it, the opposite of the oldest. The file is not committed.
            - name: Find the oldest supported Node
              run: |
                  node -e "import('./scripts/floor.mjs').then(({ floorOf }) => {
                      const floor = floorOf(require('./packages/prose-check/package.json').engines.node);
                      if (floor === undefined) throw new Error('engines.node is not a range the oldest Node check can read');
                      console.log(floor);
                  })" > prose-check-floor

            - name: Set up the oldest supported Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: prose-check-floor

            # Outside the repository, in a git repository of its own, so the command reads only
            # what that repository holds, and with install scripts off, as a repository installs it.
            - name: Install the packed prose check into an empty repository
              run: |
                  mkdir "$RUNNER_TEMP/consumer"
                  cd "$RUNNER_TEMP/consumer"
                  git init --quiet
                  npm init -y
                  npm install --engine-strict --ignore-scripts --save-dev "$RUNNER_TEMP"/jasonsdevspace-prose-check-*.tgz
                  printf 'node_modules/\n' > .gitignore
                  printf 'One sentence. Then another.\n' > README.md

            - name: Pass a repository of plain prose
              working-directory: ${{ runner.temp }}/consumer
              run: ./node_modules/.bin/check-prose

            # The dash is built from its code point, so this file holds none.
            - name: Fail a repository with an em dash in it
              working-directory: ${{ runner.temp }}/consumer
              run: |
                  node -e "require('fs').writeFileSync('dashed.md', 'a' + String.fromCodePoint(0x2014) + 'b\n')"
                  if ./node_modules/.bin/check-prose; then
                      echo "the check passed a file with an em dash in it"
                      exit 1
                  fi

            - name: Find one problem in a body given as Markdown
              working-directory: ${{ runner.temp }}/consumer
              run: |
                  node --input-type=module -e "
                      import { proseProblems } from '@jasonsdevspace/prose-check';
                      const found = proseProblems('body.md', 'a' + String.fromCodePoint(0x2014) + 'b');
                      if (found.length !== 1) throw new Error('found ' + found.length + ' problems, not one');
                  "

            # The commit message command from the same tarball: a plain message passes, and one
            # with a British spelling is refused with status 1, naming the rule, so a crash is not
            # taken for a refusal. The word is built from parts, so this file holds none.
            - name: Pass and refuse a commit message
              working-directory: ${{ runner.temp }}/consumer
              run: |
                  printf 'Keep the floor job beside the other checks\n' > message
                  ./node_modules/.bin/check-commit-message message
                  node -e "require('fs').writeFileSync('message', 'Keep the col' + 'our\\n')"
                  status=0
                  ./node_modules/.bin/check-commit-message message 2> refused || status=$?
                  if [ "$status" -ne 1 ] || ! grep -q 'British spelling' refused; then
                      echo "the command did not refuse a British spelling with status 1, it gave $status:"
                      cat refused
                      exit 1
                  fi
                  rm message refused

            # As Node and as a bundler resolve the types, with the package's own declarations
            # checked whole, so one that a setting cannot find fails here, not in a repository
            # that installs it.
            - name: Type-check as an installer would
              working-directory: ${{ runner.temp }}/consumer
              run: |
                  cat > uses.mts <<'TS'
                  import { proseProblems, repositoryProblems } from '@jasonsdevspace/prose-check';
                  const found: string[] = proseProblems('body.md', 'Plain prose.', 'body');
                  const all: string[] = repositoryProblems('.');
                  export const count: number = found.length + all.length;
                  TS
                  tsc="$GITHUB_WORKSPACE/node_modules/typescript/bin/tsc"
                  node "$tsc" --strict --noEmit --skipLibCheck false --target es2023 --module nodenext --moduleResolution nodenext uses.mts
                  node "$tsc" --strict --noEmit --skipLibCheck false --target es2023 --module preserve --moduleResolution bundler uses.mts
                  # Removed, so the runs after this read only the files they were written with.
                  rm uses.mts

            # The same tarball on the Node the project builds on, which the floor does not cover.
            - name: Set up the project's Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc

            - name: Pass and fail on the project's Node
              working-directory: ${{ runner.temp }}/consumer
              run: |
                  rm dashed.md
                  ./node_modules/.bin/check-prose
                  node -e "require('fs').writeFileSync('dashed.md', 'a' + String.fromCodePoint(0x2014) + 'b\n')"
                  if ./node_modules/.bin/check-prose; then
                      echo "the check passed a file with an em dash in it"
                      exit 1
                  fi

            # A release publishes this tarball, now that it is proven, so the job that holds the
            # publish token never installs or builds anything.
            - name: Upload the packed prose check
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: prose-check-package
                  path: ${{ runner.temp }}/jasonsdevspace-prose-check-*.tgz
                  if-no-files-found: error
                  retention-days: 7
                  overwrite: true

    install-check-floor:
        name: Install check on oldest Node
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        outputs:
            sha256: ${{ steps.pack.outputs.sha256 }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc

            # Without their install scripts, so no dependency runs code as it installs.
            - name: Install dependencies
              run: npm ci --ignore-scripts

            # Its checksum is a job output, which no other job in the run can change, unlike the
            # artifact, so a release publishes only this tarball.
            - name: Pack the install check
              id: pack
              run: |
                  npm pack --workspace @jasonsdevspace/install-check --pack-destination "$RUNNER_TEMP"
                  tarballs=("$RUNNER_TEMP"/jasonsdevspace-install-check-*.tgz)
                  if [ "${#tarballs[@]}" -ne 1 ] || [ ! -f "${tarballs[0]}" ]; then
                      echo "packing made ${#tarballs[@]} tarballs, not one"
                      exit 1
                  fi
                  sum=$(sha256sum "${tarballs[0]}" | cut -d' ' -f1)
                  echo "sha256=$sum" >> "$GITHUB_OUTPUT"
                  # Printed too, in the form `sha256sum -c` reads, so a tarball downloaded from the
                  # run can be checked against it. The summary reports and never fails the step.
                  name=$(basename "${tarballs[0]}")
                  echo "$sum  $name"
                  printf '### Packed\n\n```\n%s  %s\n```\n' "$sum" "$name" >> "$GITHUB_STEP_SUMMARY" ||
                      echo "The summary could not be written."

            # That its exports, types, bin and files point at what the tarball holds.
            - name: Check the package manifest
              run: npx --no-install publint packages/install-check

            # Written as an exact version, because setup-node given a range installs the newest
            # Node in it, the opposite of the oldest. The file is not committed.
            - name: Find the oldest supported Node
              run: |
                  node -e "import('./scripts/floor.mjs').then(({ floorOf }) => {
                      const floor = floorOf(require('./packages/install-check/package.json').engines.node);
                      if (floor === undefined) throw new Error('engines.node is not a range the oldest Node check can read');
                      console.log(floor);
                  })" > install-check-floor

            - name: Set up the oldest supported Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: install-check-floor

            # Outside the repository, in a git repository of its own, so the command reads only
            # what that repository holds, and with install scripts off, as a repository installs it.
            - name: Install the packed install check into an empty repository
              run: |
                  mkdir "$RUNNER_TEMP/consumer"
                  cd "$RUNNER_TEMP/consumer"
                  git init --quiet
                  npm init -y
                  npm install --engine-strict --ignore-scripts --save-dev "$RUNNER_TEMP"/jasonsdevspace-install-check-*.tgz
                  printf 'node_modules/\n' > .gitignore
                  mkdir -p .github/workflows
                  printf 'on: push\njobs:\n    a:\n        steps:\n            - run: npm ci --ignore-scripts\n' > .github/workflows/ci.yml

            - name: Pass a repository whose installs leave scripts off
              working-directory: ${{ runner.temp }}/consumer
              run: ./node_modules/.bin/check-installs

            # Refused with status 1, naming the file and line, so a crash is not taken for a refusal.
            - name: Refuse an install that runs scripts
              working-directory: ${{ runner.temp }}/consumer
              run: |
                  printf 'FROM node\nRUN npm ci\n' > Dockerfile
                  status=0
                  ./node_modules/.bin/check-installs 2> refused || status=$?
                  if [ "$status" -ne 1 ] || ! grep -q 'Dockerfile:2' refused; then
                      echo "the command did not refuse an install that runs scripts with status 1, it gave $status:"
                      cat refused
                      exit 1
                  fi
                  rm Dockerfile refused

            # As Node and as a bundler resolve the types, with the package's own declarations
            # checked whole, so one that a setting cannot find fails here, not in a repository
            # that installs it.
            - name: Type-check as an installer would
              working-directory: ${{ runner.temp }}/consumer
              run: |
                  cat > uses.mts <<'TS'
                  import { installProblems, npmCommandsIn, runsOf } from '@jasonsdevspace/install-check';
                  const found: string[] = installProblems('.');
                  const commands = runsOf('steps:\n    - run: npm ci\n').flatMap(({ run }) => npmCommandsIn(run));
                  export const count: number = found.length + commands.length;
                  TS
                  tsc="$GITHUB_WORKSPACE/node_modules/typescript/bin/tsc"
                  node "$tsc" --strict --noEmit --skipLibCheck false --target es2023 --module nodenext --moduleResolution nodenext uses.mts
                  node "$tsc" --strict --noEmit --skipLibCheck false --target es2023 --module preserve --moduleResolution bundler uses.mts
                  # Removed, so the runs after this read only the files they were written with.
                  rm uses.mts

            # The same tarball on the Node the project builds on, which the floor does not cover.
            - name: Set up the project's Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc

            - name: Pass and refuse on the project's Node
              working-directory: ${{ runner.temp }}/consumer
              run: |
                  ./node_modules/.bin/check-installs
                  printf 'FROM node\nRUN npm ci\n' > Dockerfile
                  if ./node_modules/.bin/check-installs; then
                      echo "the check passed an install that runs scripts"
                      exit 1
                  fi

            # A release publishes this tarball, now that it is proven, so the job that holds the
            # publish token never installs or builds anything.
            - name: Upload the packed install check
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: install-check-package
                  path: ${{ runner.temp }}/jasonsdevspace-install-check-*.tgz
                  if-no-files-found: error
                  retention-days: 7
                  overwrite: true
