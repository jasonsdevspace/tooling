name: Pull request message check

# The check of a pull request's title and body that each app repository calls, pinned to a commit,
# from a workflow of its own on pull_request. A title, with its number, becomes the commit on main
# when it is squashed, and a body is what a reader of the pull request sees. Both are written on
# GitHub where no hook runs, so they pass the same check a commit message does, as written,
# headings included.
# It runs the prose check's command from the tarball the caller's lockfile names: the address,
# version and hash all come from that lockfile, the address must be the registry's own address for
# that version, the tarball is checked against that hash before it is unpacked, the file that runs
# is the one checked, and no install runs.
# Dependabot's body quotes release notes written elsewhere, so only its title is held to the house
# rules.
# GitHub shows the check under the caller's job name and then this job's, so a caller job named
# Message reports it as "Message / PR title and body".
on:
    workflow_call:

permissions:
    contents: read

jobs:
    check:
        name: PR title and body
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        steps:
            # The caller's repository, at the pull request's merge commit.
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # The Node the caller names in .nvmrc, not the runner's own.
            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc

            - name: Check the title and body
              env:
                  TITLE: ${{ github.event.pull_request.title }}
                  BODY: ${{ github.event.pull_request.body }}
                  AUTHOR: ${{ github.event.pull_request.user.login }}
              run: |
                  if [ -z "$TITLE" ]; then
                      echo "this check runs only for a pull request, and was called without one"
                      exit 1
                  fi
                  if [ "$AUTHOR" = "dependabot[bot]" ]; then
                      printf '%s\n' "$TITLE" > "$RUNNER_TEMP/message"
                  else
                      printf '%s\n\n%s\n' "$TITLE" "$BODY" > "$RUNNER_TEMP/message"
                  fi
                  values=$(node -p "const p = require('./package-lock.json').packages['node_modules/@jasonsdevspace/prose-check']; [p.version, p.resolved, p.integrity].join('\n')")
                  { read -r version; read -r resolved; read -r integrity; } <<< "$values"
                  if [ -z "$version" ] || [ "$version" = undefined ]; then
                      echo "the lockfile names no version of the prose check"
                      exit 1
                  fi
                  if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] ||
                      [ "$resolved" != "https://registry.npmjs.org/@jasonsdevspace/prose-check/-/prose-check-$version.tgz" ]; then
                      echo "the lockfile resolves the prose check outside the npm registry"
                      exit 1
                  fi
                  curl --fail --silent --show-error --proto '=https' --max-time 60 --output "$RUNNER_TEMP/prose-check.tgz" "$resolved"
                  if [ "sha512-$(openssl dgst -sha512 -binary "$RUNNER_TEMP/prose-check.tgz" | base64 -w0)" != "$integrity" ]; then
                      echo "the prose check's tarball does not match the lockfile's hash"
                      exit 1
                  fi
                  mkdir "$RUNNER_TEMP/prose-check"
                  tar -xzf "$RUNNER_TEMP/prose-check.tgz" -C "$RUNNER_TEMP/prose-check"
                  node "$RUNNER_TEMP/prose-check/package/bin/check-commit-message.mjs" --as-is "$RUNNER_TEMP/message"
